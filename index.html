<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#026E57">
<title>PSS Vendas</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Nunito+Sans:opsz,wght@6..12,400;6..12,600;6..12,700;6..12,800&display=swap" rel="stylesheet">
<link rel="manifest" href="manifest.json">

<link rel="apple-touch-icon" href="icon-192.png">

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>

<style>
:root{
  --laranja:#FD9B02; --laranja-esc:#C97A00; --laranja-claro:#FFF3DC;
  --verde:#026E57; --verde-esc:#014D3D; --verde-claro:#E3F2EE;
  --fundo:#F7F4EC; --card:#FFFFFF; --texto:#1E2A26; --sub:#5E6B66; --linha:#E6E1D5;
  --ruim:#C4372B; --ruim-claro:#FCE9E7; --bom:#1F8A5B;
  --raio:16px;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--fundo);color:var(--texto);font-family:"Nunito Sans",system-ui,-apple-system,Segoe UI,Roboto,sans-serif;font-size:16px}
body{padding-bottom:env(safe-area-inset-bottom)}
button,select,input{font-family:inherit;font-size:16px}
.topo{position:sticky;top:0;z-index:20;background:var(--verde);color:#fff;padding:calc(env(safe-area-inset-top) + 10px) 12px 10px;display:flex;align-items:center;gap:10px;box-shadow:0 2px 8px rgba(0,0,0,.12)}
.topo h1{font-size:19px;margin:0;flex:1;font-weight:800;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.btn-voltar{background:rgba(255,255,255,.16);border:0;color:#fff;border-radius:12px;min-width:48px;height:48px;font-size:24px;font-weight:800;cursor:pointer}
.chip-user{background:var(--laranja);color:#3a2400;border:0;border-radius:24px;height:40px;padding:0 14px;font-weight:800;cursor:pointer;white-space:nowrap}
main{max-width:760px;margin:0 auto;padding:14px 14px 40px}
.prot{font-size:12.5px;color:var(--sub);text-align:center;margin:2px 0 12px}
.card{background:var(--card);border-radius:var(--raio);padding:14px;box-shadow:0 1px 3px rgba(30,42,38,.08);margin-bottom:12px}
.card h2{font-size:16px;margin:0 0 10px;color:var(--verde-esc);font-weight:800}
.kpis{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:12px}
.kpi{background:var(--card);border-radius:var(--raio);padding:12px 13px;box-shadow:0 1px 3px rgba(30,42,38,.08);border-top:4px solid var(--verde)}
.kpi.lar{border-top-color:var(--laranja)}
.kpi.ruim{border-top-color:var(--ruim);background:var(--ruim-claro)}
.kpi.wide{grid-column:1 / -1}
.kpi{text-align:center}
.kpi .rot{font-size:13px;color:var(--sub);font-weight:700}
.kpi .val{font-size:22px;font-weight:800;margin-top:3px;letter-spacing:-.3px}
.kpi .det{font-size:12.5px;color:var(--sub);margin-top:3px}
.up{color:var(--bom);font-weight:800}.down{color:var(--ruim);font-weight:800}
.menu{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:6px}
.menu button{background:var(--card);border:0;border-radius:var(--raio);min-height:112px;padding:14px 10px;box-shadow:0 1px 3px rgba(30,42,38,.1);cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;color:var(--verde-esc);font-weight:800;font-size:16.5px;border-bottom:5px solid var(--laranja)}
.menu button:active{transform:scale(.98)}
.menu .ic{width:44px;height:44px;border-radius:12px;background:var(--verde-claro);display:flex;align-items:center;justify-content:center}
.menu .ic svg{width:26px;height:26px;stroke:var(--verde);fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.filtros{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.fcard{padding:0;overflow:hidden;margin-bottom:10px}
.fcab{display:flex;align-items:center;gap:8px;min-height:44px;padding:6px 12px;cursor:pointer;user-select:none}
.fcab .t{font-weight:800;color:var(--verde-esc);font-size:14px;display:flex;align-items:center;gap:6px}
.fcab .t svg{width:16px;height:16px;stroke:var(--verde);fill:none;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}
.fcab .res{flex:1;min-width:0;font-size:12.5px;color:var(--sub);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;text-align:right}
.fcab .seta{width:28px;height:28px;border-radius:8px;background:var(--verde-claro);display:flex;align-items:center;justify-content:center;flex:0 0 28px;transition:transform .2s}
.fcab .seta svg{width:16px;height:16px;stroke:var(--verde);fill:none;stroke-width:2.6;stroke-linecap:round;stroke-linejoin:round}
.fcorpo{display:none;padding:2px 14px 14px;border-top:1px solid var(--linha)}
.fcard.aberto .fcorpo{display:block}
.fcard.aberto .seta{transform:rotate(180deg)}
.fcorpo .filtros{margin-top:10px}
.limpar{grid-column:1 / -1;height:40px;border:1.5px solid var(--linha);background:#fff;color:var(--sub);border-radius:12px;font-weight:800;cursor:pointer}
.filtros label{font-size:12.5px;color:var(--sub);font-weight:700;display:block;margin-bottom:3px}
.filtros .full{grid-column:1 / -1}
select,input[type=text],input[type=number],input[type=password],input[type=search]{width:100%;height:46px;border:1.5px solid var(--linha);border-radius:12px;padding:0 10px;background:#fff;color:var(--texto)}
select:focus,input:focus{outline:2px solid var(--laranja);border-color:var(--laranja)}
.msbtn{width:100%;min-height:46px;border:1.5px solid var(--linha);border-radius:12px;padding:6px 34px 6px 10px;background:#fff;color:var(--texto);text-align:left;cursor:pointer;position:relative;line-height:1.25}
.msbtn:after{content:"";position:absolute;right:14px;top:50%;width:8px;height:8px;border-right:2px solid var(--sub);border-bottom:2px solid var(--sub);transform:translateY(-70%) rotate(45deg)}
.msbtn b{color:var(--verde-esc)}
.selchips{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}
.selchips span{background:var(--verde-claro);color:var(--verde-esc);border-radius:10px;padding:4px 4px 4px 9px;font-size:12.5px;font-weight:700;display:inline-flex;align-items:center;gap:4px;max-width:100%}
.selchips span em{font-style:normal;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.selchips button{border:0;background:#fff;color:var(--verde);border-radius:8px;width:24px;height:24px;font-weight:800;cursor:pointer;flex:0 0 24px;padding:0;font-size:14px}
.abas{display:flex;gap:6px;background:#ECE7DA;padding:4px;border-radius:14px;margin-bottom:12px}
.abas button{flex:1;border:0;background:transparent;height:44px;border-radius:11px;font-weight:800;color:var(--sub);cursor:pointer;font-size:15px}
.abas button.on{background:#fff;color:var(--verde-esc);box-shadow:0 1px 3px rgba(0,0,0,.1)}
.abas.peq button{height:38px;font-size:14px}
.chips{display:flex;gap:6px;overflow-x:auto;margin:0 0 12px;padding-bottom:2px}
.chips button{flex:0 0 auto;border:1.5px solid var(--verde);background:#fff;color:var(--verde);border-radius:20px;height:36px;padding:0 13px;font-weight:800;font-size:13.5px;cursor:pointer}
.chips button.on{background:var(--verde);color:#fff}
table{width:100%;border-collapse:collapse;font-size:13.5px}
th{font-size:11.5px;line-height:1.2;color:var(--verde-esc);text-align:center;font-weight:800;padding:8px 3px 5px;background:#E6EAE7;border-bottom:2px solid #C9D3CD;position:sticky;top:0;z-index:1;vertical-align:middle}
th:first-child{border-top-left-radius:10px}th:last-child{border-top-right-radius:10px}
td:first-child{text-align:left}
table.ord th{cursor:pointer;user-select:none;-webkit-user-select:none;-webkit-tap-highlight-color:transparent}
table.ord th:active{background:#D9E0DC}
th i{display:block;font-style:normal;font-size:9.5px;line-height:1;margin-top:2px;color:#A3B0AA}
th.on{background:#D6E4DD;color:var(--verde)}th.on i{color:var(--laranja);font-size:11px}
table.pl td{font-size:12px;padding:9px 2px}table.pl th{font-size:10.5px;padding:7px 1px 4px}table.pl td.nome{max-width:29vw;font-size:12.5px}table.pl td.nome small{font-size:11px}table.pl .pct{padding:2px 4px}
tfoot td{font-weight:800;background:#F1F5F2;border-top:2px solid #C9D3CD;border-bottom:0;position:sticky;bottom:0}
.menu button.largo{grid-column:1 / -1;min-height:84px;flex-direction:row;gap:12px}
td{padding:9px 4px;border-bottom:1px solid var(--linha);text-align:right;vertical-align:top;white-space:nowrap}
td.nome{white-space:normal}
td.nome{font-weight:700;max-width:46vw;white-space:normal}
td.nome small{display:block;font-weight:400;color:var(--sub);font-size:12px}
td.nome small.vd{color:#7a8a83;font-size:11.5px}
tr.click{cursor:pointer}tr.click:active td{background:#F3EFE4}
.rol{max-height:460px;overflow:auto;margin:0 -4px;padding:0 4px}
.pct{font-weight:800;border-radius:8px;padding:2px 6px;display:inline-block}
.pct.r{background:var(--ruim-claro);color:var(--ruim)}
.pct.b{background:var(--verde-claro);color:var(--verde-esc)}
.nota{font-size:12.5px;color:var(--sub);margin:6px 0 0}
.tag{display:inline-block;background:var(--laranja-claro);color:#7a4a00;font-size:12px;font-weight:800;border-radius:8px;padding:2px 8px;margin-left:6px;vertical-align:middle}
.mais{width:100%;height:46px;border:1.5px solid var(--verde);background:#fff;color:var(--verde);border-radius:12px;font-weight:800;margin-top:10px;cursor:pointer}
.graf{position:relative;height:250px}
.cab-cli{text-align:center;border-top:5px solid var(--laranja)}
td.l{text-align:left}
td small.u{display:block;font-weight:400;color:var(--sub);font-size:11.5px}
.vazio{text-align:center;color:var(--sub);padding:26px 8px}
.aviso{background:var(--laranja-claro);color:#6b4100;border-radius:12px;padding:10px 12px;font-size:13px;margin:0 0 12px}
.carregando{display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:70vh;gap:16px;color:var(--sub)}
.spin{width:42px;height:42px;border:5px solid var(--verde-claro);border-top-color:var(--verde);border-radius:50%;animation:g 1s linear infinite}
@keyframes g{to{transform:rotate(360deg)}}
.login{max-width:520px;margin:0 auto;padding:calc(env(safe-area-inset-top) + 24px) 16px 40px;text-align:center}
.login img{width:78%;max-width:340px;margin:10px auto 6px;display:block}
.login form{display:grid;gap:12px;text-align:left;margin-top:22px}
.login label{font-size:13px;font-weight:800;color:var(--sub);display:block;margin-bottom:4px}
.login input{height:54px;font-size:17px}
.btn-entrar{height:56px;border:0;border-radius:14px;background:var(--verde);color:#fff;font-weight:800;font-size:17px;cursor:pointer;margin-top:4px}
.btn-entrar:disabled{opacity:.6}
.erro{color:var(--ruim);font-weight:700;font-size:14px;min-height:20px;text-align:center}
.login h2{font-size:15px;color:var(--sub);margin:22px 0 10px;text-align:left;font-weight:800;text-transform:uppercase;letter-spacing:.5px}
.logo-home{display:block;width:62%;max-width:280px;margin:4px auto 4px}
.marcas{display:flex;align-items:center;justify-content:center;gap:18px;margin:6px auto 8px;max-width:440px}
.marcas .pss{width:56%;max-width:240px}
.marcas .pal{width:30%;max-width:130px}
.rodape{text-align:center;margin:26px 0 6px;color:var(--sub);font-size:11.5px;line-height:1.5}
.rodape .por{display:flex;align-items:center;justify-content:center;gap:8px;font-size:12px;font-weight:700;color:var(--verde-esc)}
.rodape img,.login .rodape img{height:26px;width:auto;max-width:none;margin:0;display:inline-block}
.rodape .por{white-space:nowrap}
.ola{text-align:center;margin:0 0 4px;font-weight:800;font-size:18px}
.escopo{text-align:center;color:var(--sub);font-size:14px;margin:0 0 14px}
.ov{display:none}
.ov.on{display:flex;position:fixed;inset:0;background:rgba(0,0,0,.35);z-index:50;align-items:flex-end;justify-content:center}
.ov .box{background:#fff;width:100%;max-width:520px;border-radius:20px 20px 0 0;padding:18px 16px calc(18px + env(safe-area-inset-bottom))}
.ov .box > button{width:100%;height:52px;border-radius:14px;border:0;font-weight:800;font-size:16px;margin-top:8px;cursor:pointer}
.ms .tit{font-weight:800;font-size:17px;color:var(--verde-esc);display:flex;align-items:center;gap:8px}
.ms .tit span{flex:1}
.ms .tit small{font-size:13px;color:var(--sub);font-weight:700}
.ms input[type=search]{margin-top:10px}
.ms .acoes{display:flex;gap:8px;margin-top:8px}
.ms .acoes button{flex:1;height:36px;border:1.5px solid var(--linha);background:#fff;border-radius:10px;font-weight:800;color:var(--sub);font-size:13.5px;cursor:pointer}
.ms .lista{max-height:52vh;overflow:auto;margin:8px -4px 0;padding:0 4px;border-top:1px solid var(--linha)}
.ms .lista label{display:flex;align-items:center;gap:10px;padding:10px 2px;border-bottom:1px solid var(--linha);cursor:pointer}
.ms .lista input{width:22px;height:22px;accent-color:var(--verde);flex:0 0 22px;margin:0}
.ms .lista b{display:block;font-size:14.5px;font-weight:700}
.ms .lista small{display:block;font-size:12px;color:var(--sub)}
.ms .rodms{display:flex;gap:8px;margin-top:10px}
.ms .rodms button{flex:1;height:50px;border-radius:14px;border:0;font-weight:800;font-size:16px;cursor:pointer}
.grp h3{font-size:14.5px;margin:12px 0 6px;color:var(--verde-esc);display:flex;justify-content:space-between}
.grp ul{margin:0;padding:0 0 0 2px;list-style:none;font-size:13px}
.grp li{padding:4px 0;border-bottom:1px solid var(--linha)}
.grp li small{color:var(--sub)}
</style>
</head>
<body>
<div id="app"><div class="carregando"><div class="spin"></div><div>Carregando dados…</div></div></div>
<div class="ov" id="ov" onclick="if(event.target===this)fecharOv()"><div class="box">
  <div style="font-weight:800;font-size:17px" id="ovNome"></div>
  <div style="color:var(--sub);font-size:14px;margin-top:2px" id="ovPerfil"></div>
  <button style="background:var(--verde);color:#fff" onclick="sair()">Trocar de usuário</button>
  <button style="background:#EEE9DD;color:var(--texto)" onclick="fecharOv()">Fechar</button>
</div></div>
<div class="ov" id="ms" onclick="if(event.target===this)fecharMulti()"><div class="box ms" id="msBox"></div></div>
<script>
const LOGO_SRC='logo.png', LOGO_PAL='palamoni.png';
const marcas=()=>`<div class="marcas"><img class="pss" src="${LOGO_SRC}" alt="Pães São Sebastião"><img class="pal" src="${LOGO_PAL}" alt="Palamoni Consultoria"></div>`;
const rodape=()=>`<div class="rodape"><div class="por">Uma solução <img src="${LOGO_PAL}" alt="Palamoni Consultoria Empresarial"></div>© ${new Date().getFullYear()} Palamoni Consultoria Empresarial · uso licenciado à Pães São Sebastião</div>`;
const DIRETORIA=['Ithalo Palamoni','Moisés','Leonardo Mijoler','Eduardo Mijoler'];
// [nome completo, Nome do Colaborador na base, nome curto]
const VENDEDORES=[
 ['Roni Willian de Souza','RONI WILLIAN DE SOUZA','Roni'],
 ['Luan Medeiros Molina','LUAN MEDEIROS MOLINA','Luan'],
 ['Cíntia Helena de Oliveira','CINTIA HELENA DE OLIVEIRA','Cíntia'],
 ['Claudinei Antônio de Almeida Filho','CLAUDINEI ANTONIO DE ALMEIDA FILHO','Claudinei'],
 ['Leandro Duarte','LEANDRO DUARTE (P)','Leandro Duarte'],
 ['Henrique','HENRIQUE  (P)','Henrique'],
 ['Jair Martins Júnior','JAIR MARTINS JUNIOR','Jair'],
 ['Kerlen','KERLEN (P)','Kerlen'],
 ['Leandro Molina','LEANDRO MOLINA (P)','Leandro Molina'],
 ['Rodrigo de Azevedo','RODRIGO DE AZEVEDO FAZZIO','Rodrigo']
];
const LIMITE=3; // % troca+devolução sobre venda
const MESES=['jan','fev','mar','abr','mai','jun','jul','ago','set','out','nov','dez'];
const DSEM=['seg','ter','qua','qui','sex','sáb','dom'];
let M=null, DET={}, PD=null, PDMI=null, DIA0=Date.UTC(2025,0,1), carregou2025=true, SB=null;
let U=null; // usuário
const S={de:null,ate:null,vend:-1,rede:-1,loja:-1,busca:'',ordCli:'pct',abaRk:'piores',nivelRk:'loja',minRk:0,abaPr:'todos',lim:20,limL:30,fAberto:false,uf:'',cidade:'',prods:[],grupos:[],sem:-1,ord:{}};
const charts=[];

// ---------- formatação ----------
const nf0=new Intl.NumberFormat('pt-BR',{maximumFractionDigits:0});
const nf1=new Intl.NumberFormat('pt-BR',{minimumFractionDigits:1,maximumFractionDigits:1});
const R=c=>'R$ '+nf0.format(Math.round(c/100));
const Rk=c=>{const v=c/100;if(Math.abs(v)>=1e6)return 'R$ '+nf1.format(v/1e6)+' mi';if(Math.abs(v)>=1e4)return 'R$ '+nf0.format(v/1e3)+' mil';return 'R$ '+nf0.format(v)};
const Q=n=>nf0.format(n);
const Cx=x=>Math.abs(x)>=1000?nf0.format(x):nf1.format(x);
const Rt=c=>{const v=c/100;if(Math.abs(v)>=1e6)return nf1.format(v/1e6)+' mi';if(Math.abs(v)>=1e4)return nf0.format(v/1e3)+' mil';return nf0.format(v)};
const P=x=>isFinite(x)?nf1.format(x)+'%':'–';
const pctTag=x=>`<span class="pct ${x>LIMITE?'r':'b'}">${P(x)}</span>`;
const pctCel=(fat,dt)=>fat>0?pctTag(dt/fat*100):(dt>0?'<span class="pct r">sem venda</span>':'<span class="pct b">–</span>');
const ymLab=(i,longo)=>{const y=M.ym[i];const a=Math.floor(y/100),m=y%100;return longo?MESES[m-1].replace(/^./,s=>s.toUpperCase())+'/'+a:MESES[m-1]+'/'+String(a).slice(2)};
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const titulo=s=>s.toLowerCase().replace(/(^|\s|\(|\/|-)(\S)/g,(m,a,b)=>a+b.toUpperCase());
const semAcento=s=>String(s).normalize('NFKD').replace(/[̀-ͯ]/g,'').toUpperCase();

// ---------- dados ----------
function slugLogin(t){return String(t).normalize('NFKD').replace(/[̀-ͯ]/g,'').toLowerCase().trim().replace(/[^a-z0-9]+/g,'.').replace(/^\.+|\.+$/g,'');}
function usuarioDaSessao(sess){
  const m=(sess&&sess.user&&sess.user.app_metadata)||{};
  if(m.perfil!=='dir'&&m.perfil!=='vend'&&m.perfil!=='ger') return null;
  return {nome:m.nome||'Usuário',perfil:m.perfil,colab:m.colab||'',arquivo:m.arquivo||'',regiao:m.regiao||''};
}
// perfis: dir = diretoria (tudo + Produção); ger = gestor (todos os vendedores de uma região, sem custo/impostos/margem); vend = vendedor (só os próprios)
const verTodos=()=>U.perfil!=='vend';            // vê todos os vendedores (filtro de vendedor)
const verFin=()=>U.perfil==='dir';               // vê impostos, custo, receita líquida, margem, bonificação
const verProd=()=>U.perfil==='dir';              // card Produção (só diretoria: Ithalo, Leonardo, Eduardo)
const UF_NOME={MG:'Minas Gerais',SP:'São Paulo',GO:'Goiás',RJ:'Rio de Janeiro'};
function regiaoTxt(){ const r=(U&&U.regiao)||''; if(!r) return 'Empresa toda'; return r[0]==='-'?'Fora de '+(UF_NOME[r.slice(1)]||r.slice(1)):(UF_NOME[r]||r); }
async function gunzipJson(blob){
  if('DecompressionStream' in window){
    const st=blob.stream().pipeThrough(new DecompressionStream('gzip'));
    return JSON.parse(await new Response(st).text());
  }
  if(!window.pako) await new Promise((ok,err)=>{const sc=document.createElement('script');sc.src='https://cdnjs.cloudflare.com/ajax/libs/pako/2.1.0/pako.min.js';sc.onload=ok;sc.onerror=err;document.head.appendChild(sc);});
  return JSON.parse(pako.ungzip(new Uint8Array(await blob.arrayBuffer()),{to:'string'}));
}
async function carregarDados(){
  const caminho=U.perfil==='dir'?'dir/dados.json.gz':U.perfil==='ger'?'ger/'+U.arquivo+'.json.gz':'vend/'+U.arquivo+'.json.gz';
  const {data,error}=await SB.storage.from('dados').download(caminho+'?t='+Date.now());
  if(error) throw new Error('download: '+(error.message||error));
  const j=await gunzipJson(data);
  DET={todos:j.det.map(col=>Int32Array.from(col))}; delete j.det;
  PD=null; PDMI=null;
  if(j.pd&&j.pd.length===5&&j.pdBase){ PD=j.pd.map(col=>Int32Array.from(col)); delete j.pd; }
  M=j; M.vi={};M.vend.forEach((v,i)=>M.vi[v]=i);
  M.ri={};M.rede.forEach((r,i)=>M.ri[r]=i);
  M.cr=Int16Array.from(M.cli.map(c=>M.ri[c[1]]??-1));
  // grupos de produto e cadastro de embalagem (grupos.js)
  const cad=window.CAD_PROD||{}, gp=window.grupoProduto||(()=>'Outros');
  M.grp=M.prod.map(p=>gp(p[0],p[1]));
  M.cx=Float64Array.from(M.prod.map(p=>{const c=cad[String(p[1]).trim()];return c?+c[3]||0:0}));
  M.un=Float64Array.from(M.prod.map(p=>{const c=cad[String(p[1]).trim()];return c?+c[2]||0:0}));
  M.cad=M.prod.map(p=>cad[String(p[1]).trim()]||null);
  if(PD){
    const [y,m,d]=M.pdBase.split('-').map(Number); DIA0=Date.UTC(y,m-1,d);
    const ymi={}; M.ym.forEach((v,i)=>ymi[v]=i); const memo={}, dia=PD[0];
    PDMI=new Int16Array(dia.length);
    for(let i=0;i<dia.length;i++){ const o=dia[i]; let r=memo[o]; if(r===undefined){ const dt=new Date(DIA0+o*864e5); r=memo[o]=ymi[dt.getUTCFullYear()*100+dt.getUTCMonth()+1]??-1; } PDMI[i]=r; }
  }
  S.de=S.ate=M.ym.length-1; S.vend=-1;S.rede=-1;S.loja=-1;S.busca='';S.uf='';S.cidade='';S.prods=[];S.grupos=[];S.sem=-1;S.ord={};
  cacheMask={k:null}; cacheOpc={k:null}; cacheVd={k:null}; cachePM={k:null};
  M.temUF=M.cli.some(c=>c[5]);
}

// clientes que passam no filtro de UF/cidade (null = sem filtro)
let cacheMask={k:null,m:null};
function mascaraLocal(){
  if(!S.uf&&!S.cidade) return null;
  const k=S.uf+'|'+S.cidade;
  if(cacheMask.k!==k){ const m=new Uint8Array(M.cli.length); M.cli.forEach((c,i)=>{ if((!S.uf||c[5]===S.uf)&&(!S.cidade||c[4]===S.cidade)) m[i]=1; }); cacheMask={k,m}; }
  return cacheMask.m;
}
// produtos que passam no filtro de grupo e de produto (null = sem filtro). soGrupo: ignora a escolha de produtos
let cachePM={k:null,m:null};
function prodMask(soGrupo){
  const usaP=!soGrupo&&S.prods.length;
  if(!usaP&&!S.grupos.length) return null;
  const k=(usaP?S.prods.join(','):'')+'|'+S.grupos.join('|')+'|'+(soGrupo?1:0);
  if(cachePM.k!==k){ const m=new Uint8Array(M.prod.length);
    if(usaP) S.prods.forEach(p=>m[p]=1); else { const g=new Set(S.grupos); M.grp.forEach((x,i)=>{ if(g.has(x)) m[i]=1; }); }
    cachePM={k,m}; }
  return cachePM.m;
}
function escopoVend(){ if(U.perfil==='vend') return M.vi[U.colab]; return S.vend; }
// percorre linhas de detalhe no período/escopo; filtros opcionais: rede, loja, local (UF/cidade), pm (máscara de produtos)
function cada(de,ate,fn,o={}){
  const vf=o.vend===undefined?escopoVend():o.vend, rf=o.rede??-1, lf=o.loja??-1, pm=o.pm||null, cr=M.cr, mk=o.local?mascaraLocal():null;
  for(const d of Object.values(DET)){
    const [m,v,c,p,fat,qv,dev,qd,trc,qt]=d; const n=m.length;
    for(let i=0;i<n;i++){
      const mi=m[i]; if(mi<de||mi>ate) continue;
      if(vf>=0 && v[i]!==vf) continue;
      if(pm && !pm[p[i]]) continue;
      const ci=c[i];
      if(lf>=0){ if(ci!==lf) continue; } else { if(rf>=0 && cr[ci]!==rf) continue; if(mk && !mk[ci]) continue; }
      fn(mi,ci,p[i],fat[i],qv[i],dev[i],qd[i],trc[i],qt[i],v[i]);
    }
  }
}
function resumo(de,ate,o={}){
  const vf=o.vend===undefined?escopoVend():o.vend, rf=o.rede??-1;
  const t={fat:0,qv:0,dev:0,qd:0,trc:0,qt:0,bon:0,imp:0,cus:0};
  for(const r of M.resumo){ if(r[0]<de||r[0]>ate) continue; if(vf>=0&&r[1]!==vf) continue; if(rf>=0&&r[2]!==rf) continue;
    t.fat+=r[3];t.qv+=r[4];t.dev+=r[5];t.qd+=r[6];t.trc+=r[7];t.qt+=r[8];t.bon+=r[9];t.imp+=r[10];t.cus+=r[11]; }
  t.dt=t.dev+t.trc; t.qdt=t.qd+t.qt; t.pct=t.fat?t.dt/t.fat*100:NaN;
  t.rl=t.fat-t.dt-t.imp; t.lb=t.rl-t.cus; t.mg=t.rl?t.lb/t.rl*100:NaN;
  return t;
}

  return (M.dias&&M.dias[String(M.ym[mi])])||0;

// vendedor de cada loja (ou rede) no período: quem mais movimentou; +N quando há outros
let cacheVd={k:null};
function vendDe(k,nivel){
  if(!verTodos()) return null;
  const vf=escopoVend(), ck=S.de+'|'+S.ate+'|'+vf;
  if(cacheVd.k!==ck){
    const mapa=(de,ate)=>{ const L={}, Rd={}; cada(de,ate,(mi,c,p,fat,qv,dev,qd,trc,qt,v)=>{ const x=fat+dev+trc;
        const a=L[c]||(L[c]={}); a[v]=(a[v]||0)+x; const r=M.cr[c], b=Rd[r]||(Rd[r]={}); b[v]=(b[v]||0)+x; },{vend:vf}); return {L,Rd}; };
    cacheVd={k:ck,per:mapa(S.de,S.ate),tudo:null};
  }
  let a=(nivel==='rede'?cacheVd.per.Rd:cacheVd.per.L)[k];
  if(!a){ if(!cacheVd.tudo) cacheVd.tudo=(()=>{ const L={}, Rd={}; cada(0,M.ym.length-1,(mi,c,p,fat,qv,dev,qd,trc,qt,v)=>{ const x=fat+dev+trc; const a=L[c]||(L[c]={}); a[v]=(a[v]||0)+x; const r=M.cr[c], b=Rd[r]||(Rd[r]={}); b[v]=(b[v]||0)+x; },{vend:vf}); return {L,Rd}; })();
    a=(nivel==='rede'?cacheVd.tudo.Rd:cacheVd.tudo.L)[k]; }
  if(!a) return null;
  const vs=Object.keys(a).map(Number).sort((x,y)=>a[y]-a[x]);
  return {v:vs[0],n:vs.length};
}
function vendTxt(k,nivel){ const x=vendDe(k,nivel); return x?'Vendedor: '+nomeCurto(x.v)+(x.n>1?` +${x.n-1}`:''):''; }
const vdHtml=(k,nivel)=>{ const t=vendTxt(k,nivel); return t?`<small class="vd">${esc(t)}</small>`:''; };

// ---------- opções dos filtros: só o que tem dado com os outros filtros escolhidos ----------
// Cada lista considera o período, o vendedor e os demais filtros da tela (menos ela mesma).
let cacheOpc={k:null,o:null}, OPTS_TELA={};
function opcoes(opts){
  const rf=opts.rede?S.rede:-1, lf=opts.rede&&opts.loja?S.loja:-1, uf=opts.local?S.uf:'', cid=opts.local?S.cidade:'';
  const gm=opts.produto?prodMask(true):null, pm=opts.produto&&S.prods.length?prodMask(false):null;
  const vf=escopoVend();
  const k=[S.de,S.ate,vf,rf,lf,uf,cid,opts.produto?S.prods.join(','):'',opts.produto?S.grupos.join('|'):''].join('§');
  if(cacheOpc.k===k) return cacheOpc.o;
  const o={vend:new Set(),rede:{},uf:new Set(),cid:new Set(),loja:new Set(),prod:new Set(),prodG:new Set()};
  const cr=M.cr, cli=M.cli;
  for(const d of Object.values(DET)){
    const [m,v,c,p]=d; const n=m.length;
    for(let i=0;i<n;i++){
      const mi=m[i]; if(mi<S.de||mi>S.ate) continue;
      const ci=c[i], pi=p[i], r=cr[ci], cl=cli[ci];
      const okR=rf<0||r===rf, okL=lf<0||ci===lf, okU=!uf||cl[5]===uf, okC=!cid||cl[4]===cid, okG=!gm||gm[pi], okP=!pm||pm[pi];
      const okLocal=okR&&okL&&okU&&okC;
      if(okLocal&&okG&&okP) o.vend.add(v[i]);
      if(vf>=0&&v[i]!==vf) continue;
      if(okG&&okP){
        if(okU&&okC) (o.rede[r]||(o.rede[r]=new Set())).add(ci);
        if(okR) o.uf.add(cl[5]);
        if(okR&&okU) o.cid.add(cl[4]);
        if(okR&&okU&&okC) o.loja.add(ci);
      }
      if(okLocal){ o.prodG.add(pi); if(okG) o.prod.add(pi); }
    }
  }
  cacheOpc={k,o}; return o;
}

  contMulti();

const rotulos={id:'rotulos',afterDatasetsDraw(ch){
  const ctx=ch.ctx;
  ch.data.datasets.forEach((ds,di)=>{ const o=ds.rot; if(!o) return; const meta=ch.getDatasetMeta(di); if(meta.hidden) return;
    meta.data.forEach((el,i)=>{ const v=ds.data[i]; if(v==null) return; const txt=o.fmt(v);
      ctx.save(); ctx.font=`800 ${o.size}px "Nunito Sans", system-ui, sans-serif`;
      if(o.vertical){
        ctx.textBaseline='middle';
        if(o.tipo==='bar'){ const h=el.base-el.y; ctx.translate(el.x,el.y+5); ctx.rotate(-Math.PI/2); ctx.textAlign='right';
          ctx.fillStyle=h>ctx.measureText(txt).width+8?'#fff':o.cor; if(ctx.fillStyle==o.cor){ctx.textAlign='left';ctx.translate(10,0);} }
        else { ctx.translate(el.x,el.y-8); ctx.rotate(-Math.PI/2); ctx.textAlign='left'; ctx.fillStyle=o.cor; }
        ctx.fillText(txt,0,0);
      } else { ctx.textAlign='center'; ctx.textBaseline='bottom'; ctx.fillStyle=o.cor; ctx.fillText(txt,el.x,el.y-5); }
      ctx.restore(); }); });
}};

async function entrar(ev){
  ev.preventDefault();
  const u=document.getElementById('lgU').value, p=document.getElementById('lgS').value, e=document.getElementById('lgE'), b=document.getElementById('lgB');
  if(!u.trim()||!p){ e.textContent='Preencha usuário e senha.'; return; }

  const {data,error}=await SB.auth.signInWithPassword({email:slugLogin(u)+'@'+CFG.dominio,password:p});
  if(error){ b.disabled=false; b.textContent='Entrar'; e.textContent=/invalid/i.test(error.message)?'Usuário ou senha incorretos.':/banned/i.test(error.message)?'Acesso bloqueado. Fale com a Controladoria.':'Não foi possível entrar: '+error.message; return; }
  U=usuarioDaSessao(data.session);
  if(!U){ await SB.auth.signOut(); b.disabled=false; b.textContent='Entrar'; e.textContent='Usuário sem perfil configurado.'; return; }
  await abrir();
}

  document.getElementById('app').innerHTML='<div class="carregando"><div class="spin"></div><div>Carregando seus indicadores…</div></div>';

}

function grafVendas(){
  const vf=escopoVend(), rf=S.rede; let labs=[],fat=[],pct=[];
  if(S.de===S.ate){
    const pre=prefixo(S.de); const m={};
    for(const d of M.diario){ if(!d[0].startsWith(pre)) continue; if(vf>=0&&d[1]!==vf) continue; if(rf>=0&&d[2]!==rf) continue; const k=d[0]; m[k]=m[k]||[0,0]; m[k][0]+=d[3]; m[k][1]+=d[4]+d[5]; }
    Object.keys(m).sort().forEach(k=>{ if(m[k][0]<=0) return; labs.push(k.slice(8)+'/'+k.slice(5,7)); fat.push(m[k][0]/100); pct.push(m[k][1]/m[k][0]*100); });
  } else {
    for(let i=S.de;i<=S.ate;i++){ const r=resumo(i,i,{rede:rf}); labs.push(ymLab(i)); fat.push(r.fat/100); pct.push(isFinite(r.pct)?r.pct:null); }
  }
  const muitos=labs.length>8, tam=labs.length>16?9.5:labs.length>8?10.5:12;

    options:{animation:false,maintainAspectRatio:false,layout:{padding:{top:muitos?4:22}},plugins:{legend:{display:false},tooltip:{callbacks:{label:c=>'R$ '+nf0.format(c.raw)}}},
      scales:{y:{grace:'8%',ticks:{callback:fmtMi,maxTicksLimit:6},grid:{color:'#EEE9DD'}},x:{grid:{display:false}}}}}));
  charts.push(new Chart(document.getElementById('g2'),{type:'line',plugins:[rotulos],data:{labels:labs,datasets:[
      {data:pct,borderColor:'#FD9B02',backgroundColor:'#FD9B02',pointRadius:4,tension:.25,spanGaps:true,rot:{fmt:v=>nf1.format(v)+'%',size:tam,cor:'#8A5400',vertical:muitos,tipo:'line'}},

// ordena pelo % de DEV+TRC (pior primeiro). Quem vendeu menos que o mínimo vai para o fim, para não distorcer.
function ordemPct(lst,fat,dt){
  const min=S.minRk*100, pc=x=>fat(x)>0?dt(x)/fat(x):(dt(x)>0?Infinity:0);
  const g=x=>fat(x)<=0?2:(fat(x)>=min?0:1); // 0 = normal, 1 = abaixo do mínimo, 2 = sem venda no período
  return lst.sort((a,b)=>{const ga=g(a), gb=g(b); if(ga!==gb) return ga-gb; return pc(b)-pc(a)||dt(b)-dt(a);});
}
const abasOrdem=(tipo)=>`<div class="abas peq"><button class="${S.ordCli==='pct'?'on':''}" onclick="S.ordCli='pct';S.ord={};render()">Maior % de troca</button><button class="${S.ordCli==='fat'?'on':''}" onclick="S.ordCli='fat';S.ord={};render()">${tipo==='loja'?'Maiores vendas':'Mais vendidos'}</button></div>`;
const notaOrdem=()=>S.ordCli==='pct'?`Ordenado pelo maior % de trocas + devoluções sobre a venda.${S.minRk>0?` Quem vendeu menos de R$ ${nf0.format(S.minRk)} fica no fim.`:''} Quem teve troca/devolução sem venda no período aparece no final, como "sem venda".`:'Ordenado pela maior venda.';

// ---------- tabelas com cabeçalho ordenável (toque no título da coluna) ----------
// col: {t:título, s:valor p/ ordenar (null = sempre no fim), h:html da célula, cls, txt (ordem alfabética), asc (1º toque crescente), g (grupo fixo, ex.: abaixo do mínimo)}
// o: {lim, def:{c,d}, tr:(x)=>atributos da linha, cls, foot:[html por coluna]}
const TABS={};
function ordTab(id,j){
  const T=TABS[id]; if(!T) return; const st=S.ord[id]||T.def, c=T.cols[j];
  S.ord[id]= st&&st.c===j ? {c:j,d:-st.d} : {c:j,d:(c.txt||c.asc)?1:-1};
  render();
}
function tab(id,cols,lst,o={}){
  TABS[id]={cols,def:o.def||null};
  const st=S.ord[id]; let arr=lst;
  if(st&&cols[st.c]){ const c=cols[st.c];
    arr=[...lst].sort((a,b)=>{ if(c.g){const d=c.g(a)-c.g(b); if(d) return d;}
      const va=c.s(a), vb=c.s(b); const na=va==null||(typeof va==='number'&&!isFinite(va)), nb=vb==null||(typeof vb==='number'&&!isFinite(vb));
      if(na||nb) return na&&nb?0:na?1:-1;
      return (c.txt?String(va).localeCompare(String(vb),'pt',{numeric:true,sensitivity:'base'}):va-vb)*st.d; }); }
  if(o.lim) arr=arr.slice(0,o.lim);
  const at=st||o.def||{};
  return `<table class="ord ${o.cls||''}"><thead><tr>${cols.map((c,j)=>`<th class="${at.c===j?'on':''}" onclick="ordTab('${id}',${j})">${c.t}<i>${at.c===j?(at.d>0?'▲':'▼'):'⇅'}</i></th>`).join('')}</tr></thead><tbody>
   ${arr.map(x=>`<tr ${o.tr?o.tr(x):''}>${cols.map(c=>`<td class="${c.cls||''}">${c.h(x)}</td>`).join('')}</tr>`).join('')}</tbody>${o.foot?`<tfoot><tr>${o.foot.map((f,j)=>`<td class="${j?'':'l'}">${f}</td>`).join('')}</tr></tfoot>`:''}</table>`;
}
const locCli=c=>titulo(M.cli[c][1])+' · '+titulo(M.cli[c][4])+(M.cli[c][5]?'/'+M.cli[c][5]:'');
const pcVal=x=>x.fat>0?x.dt/x.fat:null;
const colRank={t:'#',asc:1,s:x=>x.rk,h:x=>`<span style="color:var(--sub);font-weight:800">${x.rk}</span>`};
const colLoja={t:'Loja',txt:1,cls:'nome l',s:x=>M.cli[x.c][0],h:x=>`${esc(M.cli[x.c][0])}<small>${esc(locCli(x.c))}</small>${vdHtml(x.c,'loja')}`};
const colProd={t:'Produto',txt:1,cls:'nome l',s:x=>titulo(M.prod[x.p][0]),h:x=>`${esc(titulo(M.prod[x.p][0]))}${S.grupos.length!==1?`<small>${esc(M.grp[x.p])}</small>`:''}`};
const colVenda={t:'Venda<br>R$ · un.',s:x=>x.fat,h:x=>`${Rt(x.fat)}<small class="u">${Q(x.qv)} un.</small>`};
const colDT={t:'DEV+TRC<br>R$ · un.',s:x=>x.dt,h:x=>`${Rt(x.dt)}<small class="u">${Q(x.qdt)} un.</small>`};
const colPct=()=>{const min=S.minRk*100; return {t:'%',g:x=>x.fat>0&&x.fat<min?1:0,s:pcVal,h:x=>pctCel(x.fat,x.dt)};};
const defOrdCli=(ini)=>S.ordCli==='pct'?{c:ini+2,d:-1}:{c:ini,d:-1};
const trLoja=x=>`onclick="abrirLoja(${x.c})" class="click"`;
const trLojaCli=x=>`onclick="abrirLojaCli(${x.c})" class="click"`;
const trProd=x=>`onclick="abrirProd(${x.p})" class="click"`;
const notaToque='Toque no título de uma coluna para ordenar; toque de novo para inverter.';
const notaVoltar='O botão ‹ volta um passo.';

// tabelas reutilizáveis
function tabProdutos(id,lst,mostrarRank,o={}){
  lst.forEach((x,i)=>x.rk=i+1);
  const cols=mostrarRank?[colRank,colProd,colVenda,colDT,colPct()]:[colProd,colVenda,colDT,colPct()];
  return tab(id,cols,lst,o);
}
function tabLojas(id,ls,tr,o={}){
  return tab(id,[colLoja,colVenda,colDT,colPct()],ls.map(([c,v])=>({c:+c,...v})),{...o,tr:tr||null});
}
function agregaDetalhe(){
  const tot={fat:0,qv:0,dev:0,qd:0,trc:0,qt:0}, porP={}, porL={};
  cada(S.de,S.ate,(mi,c,p,fat,qv,dev,qd,trc,qt)=>{
    tot.fat+=fat;tot.qv+=qv;tot.dev+=dev;tot.qd+=qd;tot.trc+=trc;tot.qt+=qt;
    const o=porP[p]||(porP[p]={fat:0,qv:0,dt:0,qdt:0}); o.fat+=fat;o.qv+=qv;o.dt+=dev+trc;o.qdt+=qd+qt;
    const l=porL[c]||(porL[c]={fat:0,qv:0,dt:0,qdt:0}); l.fat+=fat;l.qv+=qv;l.dt+=dev+trc;l.qdt+=qd+qt; },{rede:S.rede,loja:S.loja,local:true,pm:prodMask()});
  tot.dt=tot.dev+tot.trc; tot.qdt=tot.qd+tot.qt; tot.pct=tot.fat?tot.dt/tot.fat*100:NaN;
  return {tot,porP,porL};
}
function cabecalhoEscopo(nLojas){
  const l=S.loja>=0?M.cli[S.loja]:null;
  const loc=!l&&(S.cidade||S.uf)?' · '+(S.cidade?titulo(S.cidade)+(S.uf?'/'+S.uf:''):S.uf):'';
  const tp=txtProdutos(true);
  const vd=l?vendTxt(S.loja,'loja'):'';
  return `<div class="card cab-cli"><div style="font-weight:800;font-size:17px">${esc((l?l[0]:S.rede>=0?titulo(M.rede[S.rede])+' – todas as lojas':'Todas as redes')+loc)}</div>
    <div class="nota">${l?esc(titulo(l[2]))+' · '+esc(titulo(l[4]))+' · cód. '+l[3]:nLojas+' lojas com movimento'} · ${periodoTxt()}${verTodos()&&escopoVend()>=0?' · '+esc(nomeVend(escopoVend())):''}${vd&&escopoVend()<0?' · '+esc(vd):''}${tp?' · <b>'+esc(tp)+'</b>':''}</div></div>`;
}
function cardsTotais(tot){
  return `<div class="kpis">
    <div class="kpi"><div class="rot">Venda</div><div class="val">${R(tot.fat)}</div><div class="det">${Q(tot.qv)} un.</div></div>
    <div class="kpi lar"><div class="rot">$ DEV + TRC</div><div class="val">${R(tot.dt)}</div><div class="det">${Q(tot.qdt)} un. voltaram</div></div>
    <div class="kpi wide ${tot.pct>LIMITE?'ruim':''}"><div class="rot">% trocas + devoluções sobre a venda</div><div class="val">${P(tot.pct)}</div><div class="det">${tot.pct>LIMITE?'Acima do limite de '+LIMITE+'%':'Dentro do limite de '+LIMITE+'%'}<br>Trocas ${R(tot.trc)} · Devoluções ${R(tot.dev)}</div></div>
   </div>`;
}

function telaClientes(){
  let h=topo('Clientes',true)+'<main>'+filtrosHtml({rede:true,local:true,loja:true,produto:true,minimo:'Venda mínima (R$) — quem vender menos vai para o fim das listas'});
  const {tot,porP,porL}=agregaDetalhe(); const nL=Object.keys(porL).length;
  h+=cabecalhoEscopo(nL)+cardsTotais(tot);
  if(S.loja<0){
    let ls=Object.entries(porL);
    ls=S.ordCli==='pct'?ordemPct(ls,x=>x[1].fat,x=>x[1].dt):ls.sort((a,b)=>b[1].fat-a[1].fat);
    h+=`<div class="card"><h2>Lojas ${S.rede>=0?'da rede':''} <span class="tag">${ls.length}</span></h2>${abasOrdem('loja')}${ls.length?`<div class="rol" style="max-height:420px">${tabLojas('cLojas',ls,trLoja,{lim:S.lim,def:defOrdCli(1)})}</div>
      ${ls.length>S.lim?`<button class="mais" onclick="S.lim+=30;render()">Mostrar mais lojas</button>`:''}<p class="nota">${notaOrdem()} Toque numa loja para ver só ela (${notaVoltar}) ${notaToque}</p>`:'<div class="vazio">Sem movimento no período.</div>'}</div>`;
  }
  let ps=Object.entries(porP).map(([p,o])=>({p:+p,...o}));
  ps=S.ordCli==='pct'?ordemPct(ps,x=>x.fat,x=>x.dt):ps.sort((a,b)=>b.fat-a.fat);
  h+=`<div class="card"><h2>Produto a produto</h2>
    ${abasOrdem('prod')}
    ${ps.length?`<div class="rol">${tabProdutos('cProd',ps,false,{def:defOrdCli(1)})}</div><p class="nota">${notaOrdem()} ${notaToque}</p>`:'<div class="vazio">Sem movimento no período.</div>'}</div>`;
  return h+rodape()+'</main>';
}

function agrupaClientes(de,ate,nivel){
  const out={};
  cada(de,ate,(mi,c,p,fat,qv,dev,qd,trc,qt)=>{ const k=nivel==='rede'?M.cr[c]:c; const o=out[k]||(out[k]={fat:0,dt:0,qdt:0}); o.fat+=fat;o.dt+=dev+trc;o.qdt+=qd+qt; },{rede:S.rede,local:true,pm:prodMask()});
  return out;
}
function nomeCli(k,nivel){ return nivel==='rede'?{n:titulo(M.rede[k]),s:''}:{n:M.cli[k][0],s:titulo(M.cli[k][1])+' · '+titulo(M.cli[k][4])+(M.cli[k][5]?'/'+M.cli[k][5]:'')}; }
const trCli=nivel=>x=>nivel==='rede'?`onclick="abrirRedeCli(${x.k})" class="click"`:`onclick="abrirLojaCli(${x.k})" class="click"`;
function telaRanking(){
  const nivel=S.nivelRk, min=S.minRk*100;
  const extra=`<div class="full"><label>Ver por</label><select onchange="S.nivelRk=this.value;S.lim=20;render()"><option value="loja" ${nivel==='loja'?'selected':''}>Loja</option><option value="rede" ${nivel==='rede'?'selected':''}>Rede</option></select></div>`;
  let h=topo('Ranking de clientes',true)+'<main>'+filtrosHtml({rede:true,local:true,produto:true,minimo:'Venda mínima (R$) para entrar no ranking',extra});
  h+=`<div class="abas"><button class="${S.abaRk==='melhores'?'on':''}" onclick="S.abaRk='melhores';S.lim=20;S.ord={};render()">Melhores</button><button class="${S.abaRk==='piores'?'on':''}" onclick="S.abaRk='piores';S.lim=20;S.ord={};render()">Piores</button><button class="${S.abaRk==='evol'?'on':''}" onclick="S.abaRk='evol';S.lim=20;S.ord={};render()">Evolução</button></div>`;
  const colNome=(extraSub)=>({t:nivel==='rede'?'Rede':'Loja',txt:1,cls:'nome l',s:x=>nomeCli(x.k,nivel).n,h:x=>{const n=nomeCli(x.k,nivel);return `${esc(n.n)}<small>${esc(n.s)}${extraSub?(n.s?' · ':'')+extraSub(x):''}</small>${vdHtml(x.k,nivel)}`}});
  const toque=`Toque numa ${nivel==='rede'?'rede':'loja'} para abrir em Clientes (${notaVoltar})`;
  if(S.abaRk==='evol'){
    const mi=S.ate; if(mi<1) return h+'<div class="card vazio">Escolha um mês com mês anterior disponível.</div></main>';
    const a=agrupaClientes(mi,mi,nivel), b=agrupaClientes(mi-1,mi-1,nivel); const lst=[];
    for(const k in a){ if(!b[k]) continue; if(a[k].fat<=0||b[k].fat<=0||a[k].fat<min||b[k].fat<min) continue; const pa=a[k].dt/a[k].fat*100, pb=b[k].dt/b[k].fat*100; lst.push({k:+k,pa,pb,d:pa-pb,fat:a[k].fat}); }
    const pior=lst.filter(x=>x.d>0).sort((x,y)=>y.d-x.d), melhor=lst.filter(x=>x.d<0).sort((x,y)=>x.d-y.d);
    const cEv=[colNome(x=>'venda '+Rk(x.fat)),
      {t:ymLab(mi-1),s:x=>x.pb,h:x=>P(x.pb)},{t:ymLab(mi),s:x=>x.pa,h:x=>pctTag(x.pa)},
      {t:'Variação',s:x=>x.d,h:x=>`<span class="${x.d>0?'down':'up'}">${x.d>0?'▲':'▼'} ${nf1.format(Math.abs(x.d))} p.p.</span>`}];
    const tabEv=(id,arr,tit,def)=>`<div class="card"><h2>${tit} <span class="tag">${arr.length}</span></h2>${arr.length?`<div class="rol" style="max-height:380px">${tab(id,cEv,arr,{lim:S.lim,def,tr:trCli(nivel)})}</div>`:'<div class="vazio">Nenhum.</div>'}</div>`;
    return h+`<p class="nota" style="margin:-4px 2px 10px">Compara o % de trocas + devoluções de ${ymLab(mi,true)} com ${ymLab(mi-1,true)} (mês “Até” do filtro). Só clientes com venda nos dois meses${S.minRk>0?' acima do mínimo':''}. ${toque}. ${notaToque}</p>`+tabEv('evP',pior,'Pioraram',{c:3,d:-1})+tabEv('evM',melhor,'Melhoraram',{c:3,d:1})+(Math.max(pior.length,melhor.length)>S.lim?`<button class="mais" onclick="S.lim+=20;render()">Mostrar mais</button>`:'')+rodape()+'</main>';
  }
  const g=agrupaClientes(S.de,S.ate,nivel);
  let lst=Object.entries(g).filter(([k,o])=>o.fat>=min&&o.fat>0).map(([k,o])=>({k:+k,...o,p:o.dt/o.fat*100}));
  if(S.abaRk==='melhores') lst.sort((a,b)=>a.p-b.p||b.fat-a.fat); else lst.sort((a,b)=>b.p-a.p||b.dt-a.dt);
  const acima=lst.filter(x=>x.p>LIMITE).length;
  h+=`<div class="kpis"><div class="kpi"><div class="rot">${nivel==='rede'?'Redes':'Lojas'} no ranking</div><div class="val">${lst.length}</div><div class="det">${S.minRk>0?'venda ≥ R$ '+nf0.format(S.minRk):'com venda no período'}</div></div>
      <div class="kpi ${acima?'ruim':''}"><div class="rot">Acima de ${LIMITE}%</div><div class="val">${acima}</div><div class="det">${lst.length?P(acima/lst.length*100)+' do total':''}</div></div></div>`;
  h+=`<p class="nota" style="margin:-4px 2px 10px">${S.abaRk==='melhores'?'Melhores = menor % de trocas + devoluções sobre a venda; empate decide pela maior venda.':'Piores = maior % de trocas + devoluções sobre a venda.'} ${S.minRk>0?` Só entra quem vendeu pelo menos R$ ${nf0.format(S.minRk)} no período.`:''}${txtProdutos(true)?' Só os produtos escolhidos: '+esc(txtProdutos(true))+'.':''}</p>`;
  lst.forEach((x,i)=>x.rk=i+1);
  const cRk=[colRank,colNome(null),
    {t:'Venda R$',s:x=>x.fat,h:x=>Rt(x.fat)},{t:'DEV+TRC R$',s:x=>x.dt,h:x=>Rt(x.dt)},{t:'%',s:x=>x.p,h:x=>pctTag(x.p)}];
  h+=`<div class="card"><h2>${S.abaRk==='melhores'?'Menor % de trocas + devoluções':'Maior % de trocas + devoluções'}</h2>${lst.length?`${tab('rk',cRk,lst,{lim:S.lim,def:{c:4,d:S.abaRk==='melhores'?1:-1},tr:trCli(nivel)})}<p class="nota">${toque}. ${notaToque}</p>
   ${lst.length>S.lim?`<button class="mais" onclick="S.lim+=20;render()">Mostrar mais</button>`:''}`:'<div class="vazio">Nenhum cliente com venda acima do mínimo.</div>'}</div>`;
  return h+rodape()+'</main>';
}

function telaProdutos(){
  let h=topo('Produtos',true)+'<main>'+filtrosHtml({rede:true,local:true,loja:true,produto:true,minimo:'Venda mínima (R$) para entrar em Melhores e Piores'});
  const {tot,porP,porL}=agregaDetalhe(); const nL=Object.keys(porL).length;
  h+=cabecalhoEscopo(nL)+cardsTotais(tot);
  h+=`<div class="abas"><button class="${S.abaPr==='todos'?'on':''}" onclick="S.abaPr='todos';S.lim=20;S.ord={};render()">Todos</button><button class="${S.abaPr==='melhores'?'on':''}" onclick="S.abaPr='melhores';S.lim=20;S.ord={};render()">Melhores</button><button class="${S.abaPr==='piores'?'on':''}" onclick="S.abaPr='piores';S.lim=20;S.ord={};render()">Piores</button><button class="${S.abaPr==='grupos'?'on':''}" onclick="S.abaPr='grupos';S.lim=20;S.ord={};render()">Grupos</button></div>`;
  if(S.abaPr==='grupos'){
    const pg={}; for(const p in porP){ const g=M.grp[p], o=porP[p], a=pg[g]||(pg[g]={g,fat:0,qv:0,dt:0,qdt:0,n:0}); a.fat+=o.fat;a.qv+=o.qv;a.dt+=o.dt;a.qdt+=o.qdt;a.n++; }
    const lst=Object.values(pg).sort((a,b)=>b.fat-a.fat);
    const cols=[{t:'Grupo',txt:1,cls:'nome l',s:x=>x.g,h:x=>`${esc(x.g)}<small>${x.n} produto${x.n>1?'s':''}</small>`},colVenda,colDT,colPct()];
    h+=`<div class="card">${lst.length?`<div class="rol" style="max-height:560px">${tab('pGrp',cols,lst,{def:{c:1,d:-1},tr:x=>`onclick="setGrupos(['${esc(x.g).replace(/'/g,"\\'")}'])" class="click"`})}</div><p class="nota">Venda por grupo de produto. Toque num grupo para filtrar só ele. ${notaToque}</p>`:'<div class="vazio">Sem produtos no período.</div>'}
      ${verTodos()?`<button class="mais" onclick="ir('grupos')">Conferir como os produtos foram agrupados</button>`:''}</div>`;
  } else {
    let lst=Object.entries(porP).map(([p,o])=>({p:+p,...o,pc:o.fat?o.dt/o.fat*100:Infinity}));
    let nota;
    if(S.abaPr==='todos'){ lst.sort((a,b)=>b.fat-a.fat); nota='Todos os produtos, do mais vendido para o menos vendido.'; }
    else if(S.abaPr==='melhores'){ lst=lst.filter(x=>x.fat>0&&x.fat>=S.minRk*100).sort((a,b)=>a.pc-b.pc||b.fat-a.fat); nota=`Melhores = menor % de trocas + devoluções sobre a venda (empate: maior venda).${S.minRk>0?` Só produtos com venda ≥ R$ ${nf0.format(S.minRk)}.`:''}`; }
    else { lst=lst.filter(x=>x.fat>=S.minRk*100||(x.fat<=0&&x.dt>0)).sort((a,b)=>b.pc-a.pc||b.dt-a.dt); nota=`Piores = maior % de trocas + devoluções sobre a venda.${S.minRk>0?` Só produtos com venda ≥ R$ ${nf0.format(S.minRk)}.`:''}`; }
    h+=`<p class="nota" style="margin:-4px 2px 10px">${nota}</p>`;
    h+=`<div class="card">${lst.length?`<div class="rol" style="max-height:560px">${tabProdutos('pProd',lst,S.abaPr!=='todos',{lim:S.abaPr==='todos'?0:S.lim,def:S.abaPr==='todos'?{c:1,d:-1}:{c:4,d:S.abaPr==='melhores'?1:-1},tr:trProd})}</div><p class="nota">Toque num produto para ver loja a loja (${notaVoltar}) ${notaToque}</p>
      ${S.abaPr!=='todos'&&lst.length>S.lim?`<button class="mais" onclick="S.lim+=20;render()">Mostrar mais</button>`:''}`:'<div class="vazio">Sem produtos no período.</div>'}</div>`;
  }
  if(S.loja<0){
    const ls=ordemPct(Object.entries(porL),x=>x[1].fat,x=>x[1].dt);
    h+=`<div class="card"><h2>Loja a loja <span class="tag">${ls.length}</span></h2>${ls.length?`<div class="rol" style="max-height:420px">${tabLojas('pLojas',ls,trLoja,{lim:S.limL||30,def:{c:3,d:-1}})}</div>
      ${ls.length>(S.limL||30)?`<button class="mais" onclick="S.limL=(S.limL||30)+30;render()">Mostrar mais lojas</button>`:''}<p class="nota">Ordenado pelo maior % de trocas + devoluções sobre a venda${S.minRk>0?` (lojas que venderam menos de R$ ${nf0.format(S.minRk)} ficam no fim)`:''}. Toque numa loja para ver os produtos dela (${notaVoltar}) ${notaToque}</p>`:'<div class="vazio">Sem movimento.</div>'}</div>`;
  }
  return h+rodape()+'</main>';
}

  const tot={fat:0,qv:0,dev:0,qd:0,trc:0,qt:0}, porL={};

    tot.fat+=fat;tot.qv+=qv;tot.dev+=dev;tot.qd+=qd;tot.trc+=trc;tot.qt+=qt;
    const l=porL[c]||(porL[c]={fat:0,qv:0,dt:0,qdt:0}); l.fat+=fat;l.qv+=qv;l.dt+=dev+trc;l.qdt+=qd+qt; },{rede:S.rede,loja:S.loja,local:true,pm:prodMask()});
  tot.dt=tot.dev+tot.trc; tot.qdt=tot.qd+tot.qt; tot.pct=tot.fat?tot.dt/tot.fat*100:NaN;

    <div class="nota">${esc(escopoTxt())}${S.cidade||S.uf?' · '+esc(S.cidade?titulo(S.cidade)+(S.uf?'/'+S.uf:''):S.uf):''} · ${ls.length} lojas · ${periodoTxt()}</div></div>`;
  if(!S.prods.length&&!S.grupos.length) h+=`<p class="nota" style="margin:-4px 2px 10px;text-align:center">Abra <b>Filtros</b> e escolha um ou mais <b>Produtos</b> (ou um <b>Grupo</b>) para ver loja a loja só deles.</p>`;
  h+=cardsTotais(tot);
  const cols=[colLoja,
    {t:'Venda<br>R$',s:x=>x.fat,h:x=>Rt(x.fat)},
    {t:'Venda<br>un.',s:x=>x.qv,h:x=>Q(x.qv)},
    {t:'DEV+<wbr>TRC<br>R$',s:x=>x.dt,h:x=>Rt(x.dt)},
    {t:'DEV+<wbr>TRC<br>un.',s:x=>x.qdt,h:x=>Q(x.qdt)},
    colPct()];
  h+=`<div class="card"><h2>Lojas <span class="tag">${ls.length}</span></h2>${ls.length?`<div class="rol" style="max-height:560px">${tab('pl',cols,ls,{lim:S.limL||30,def:{c:5,d:-1},cls:'pl',tr:trLojaCli})}</div>
    ${ls.length>(S.limL||30)?`<button class="mais" onclick="S.limL=(S.limL||30)+30;render()">Mostrar mais lojas</button>`:''}
    <p class="nota">Começa pelo maior % de trocas + devoluções sobre a venda${S.minRk>0?` (quem vendeu menos de R$ ${nf0.format(S.minRk)} fica no fim)`:''}; troca/devolução sem venda no período aparece no final, como "sem venda". Toque numa loja para abrir a foto dela em Clientes (${notaVoltar}) ${notaToque}</p>`:'<div class="vazio">Sem movimento deste produto no período.</div>'}</div>`;
  return h+rodape()+'</main>';
}

// ---------- Produção (só diretoria): venda + troca em pacotes, caixas e pães ----------
// Produção = quantidade vendida + quantidade trocada (a troca também sai da fábrica). Caixas = pacotes ÷ pacotes por caixa (grupos.js).
const offDt=o=>new Date(DIA0+o*864e5);
const dm=o=>{const d=offDt(o);return String(d.getUTCDate()).padStart(2,'0')+'/'+String(d.getUTCMonth()+1).padStart(2,'0');};
const dowOff=o=>(((new Date(DIA0).getUTCDay()+6+o)%7)+7)%7; // 0 = segunda
function offMes(mi,fim){ const y=Math.floor(M.ym[mi]/100), m=M.ym[mi]%100; return Math.round(((fim?Date.UTC(y,m,0):Date.UTC(y,m-1,1))-DIA0)/864e5); }
function offIso(iso){ const [y,m,d]=String(iso).split('-').map(Number); return Math.round((Date.UTC(y,m-1,d)-DIA0)/864e5); }
function semanasPeriodo(){
  const a=offMes(S.de,false), fimMes=offMes(S.ate,true), b=Math.min(fimMes,offIso(M.atualizado)); const ws=[];
  if(b<a) return ws;
  for(let w=a-dowOff(a);w<=b;w+=7){ const de=Math.max(w,a), ate=Math.min(w+6,b);
    if(de>Math.min(w+4,b)) continue; // só fim de semana dentro do período: não conta como semana
    ws.push({w,de,ate,parcial:w<a||w+4>b,lab:dm(de)+' a '+dm(ate)}); }
  return ws;
}
function agregaProducao(){
  const pm=prodMask(), vf=escopoVend();
  const t={qv:0,qt:0,cx:0,qcad:0,qsem:0,paes:0}, porP={}, porB={}, porG={}, dias=new Set();
  const add=(b,p,qv,qt,dia)=>{
    const q=qv+qt, cx=M.cx[p]?q/M.cx[p]:0, pa=M.un[p]?q*M.un[p]:0;
    t.qv+=qv;t.qt+=qt;t.cx+=cx;t.paes+=pa; if(M.cx[p]) t.qcad+=q; else t.qsem+=q;
    const o=porP[p]||(porP[p]={p,qv:0,qt:0,cx:0,paes:0}); o.qv+=qv;o.qt+=qt;o.cx+=cx;o.paes+=pa;
    const k=porB[b]||(porB[b]={b,qv:0,qt:0,cx:0,paes:0}); k.qv+=qv;k.qt+=qt;k.cx+=cx;k.paes+=pa;
    const g=M.grp[p], x=porG[g]||(porG[g]={g,qv:0,qt:0,cx:0,paes:0,n:new Set()}); x.qv+=qv;x.qt+=qt;x.cx+=cx;x.paes+=pa;x.n.add(p);
    if(dia!=null&&q>0) dias.add(dia);
  };
  if(PD){
    const [dia,v,pr,qv,qt]=PD, n=dia.length, sem=S.sem;
    for(let i=0;i<n;i++){ const mi=PDMI[i]; if(mi<S.de||mi>S.ate) continue; if(vf>=0&&v[i]!==vf) continue; const p=pr[i]; if(pm&&!pm[p]) continue;
      const d=dia[i]; if(sem>=0&&(d<sem||d>sem+6)) continue;
      add(sem>=0?d:d-dowOff(d),p,qv[i],qt[i],d); }
  } else {
    cada(S.de,S.ate,(mi,c,p,fat,qv,dev,qd,trc,qt)=>add(mi,p,qv,qt,null),{pm});
  }
  return {t,porP,porB,porG,dias};
}
function telaProducao(){
  const semanas=PD?semanasPeriodo():[];
  if(S.sem>=0&&!semanas.some(w=>w.w===S.sem)) S.sem=-1;
  const extraTopo=PD?`<div class="full"><label>Semana</label><select onchange="S.sem=+this.value;S.ord={};render()"><option value="-1">Todas as semanas do período</option>${semanas.map((w,i)=>`<option ${w.w===S.sem?'selected':''} value="${w.w}">Semana ${i+1} · ${w.lab}${w.parcial?' (parcial)':''}</option>`).join('')}</select></div>`:'';
  let h=topo('Produção',true)+'<main>'+filtrosHtml({produto:true,sem:true,extraTopo});
  const gL=window.GRUPO_HAMB_LANCHE, gM=window.GRUPO_HAMB_MERCADO;
  const ig=(a)=>S.prods.length===0&&S.grupos.length===a.length&&a.every(g=>S.grupos.includes(g));
  const chip=(lab,gs)=>`<button class="${ig(gs)?'on':''}" onclick='setGrupos(${JSON.stringify(gs)})'>${lab}</button>`;
  h+=`<div class="chips">${chip('Linha Lanche',[gL])}${chip('Linha Mercado',[gM])}${chip('Todos os hambúrgueres',[gL,gM])}${chip('Tudo',[])}</div>`;
  if(!PD) h+=`<div class="aviso">Os dados ainda estão no formato antigo: a produção aparece só por mês. Rode a atualização do app no computador (atualizador novo) para ver por semana e por dia.</div>`;
  const a=agregaProducao(), t=a.t, q=t.qv+t.qt;
  const porSem=!PD?null:S.sem<0;
  // buckets na ordem (semanas, dias da semana ou meses)
  let buckets;
  if(!PD) { buckets=[]; for(let i=S.de;i<=S.ate;i++) buckets.push({b:i,lab:ymLab(i,true),curto:[ymLab(i)],parcial:false}); }
  else if(porSem) buckets=semanas.map((w,i)=>({b:w.w,lab:`Semana ${i+1}<small class="u">${w.lab}${w.parcial?' · parcial':''}</small>`,curto:['S'+(i+1),dm(w.de)],parcial:w.parcial}));
  else { buckets=[]; const w=semanas.find(x=>x.w===S.sem); for(let d=w.de;d<=w.ate;d++) buckets.push({b:d,lab:`${DSEM[dowOff(d)]} ${dm(d)}`,curto:[DSEM[dowOff(d)],dm(d)],parcial:false}); }
  buckets.forEach(k=>{ const x=a.porB[k.b]||{qv:0,qt:0,cx:0,paes:0}; Object.assign(k,{qv:x.qv,qt:x.qt,cx:x.cx,paes:x.paes}); });
  if(PD&&!porSem) buckets=buckets.filter(k=>k.qv+k.qt>0||dowOff(k.b)<5); // sábado/domingo só aparecem se tiverem movimento
  const usaCx=t.qcad>0, val=x=>usaCx?x.cx:x.qv+x.qt;
  // médias
  const compl=buckets.filter(k=>!k.parcial&&val(k)>0), comMov=buckets.filter(k=>val(k)>0);
  const base=porSem?(compl.length?compl:comMov):comMov;
  const media=base.length?base.reduce((s,k)=>s+val(k),0)/base.length:0;
  const nDias=a.dias.size, mediaDia=nDias?(usaCx?t.cx:q)/nDias:0;
  const un=usaCx?'caixas':'pacotes', fmtV=usaCx?Cx:Q;
  const tituloMedia=!PD?'Média por mês':porSem?'Média por semana':'Média por dia';
  const detMedia=!PD?`${base.length} ${base.length===1?'mês':'meses'} com produção`:porSem?(compl.length?`${compl.length} semana${compl.length>1?'s':''} completa${compl.length>1?'s':''}`:`${comMov.length} semana${comMov.length>1?'s':''} (parciais)`):`${comMov.length} dia${comMov.length>1?'s':''} com produção`;
  h+=`<div class="card cab-cli"><div style="font-weight:800;font-size:17px">${esc(txtProdutos(false))}</div>
    <div class="nota">${verTodos()&&escopoVend()>=0?esc(nomeVend(escopoVend())):regiaoTxt()} · ${periodoTxt()}${S.sem>=0?' · semana '+esc(semanas.find(x=>x.w===S.sem).lab):''}</div></div>`;
  h+=`<div class="kpis">
    <div class="kpi wide"><div class="rot">${usaCx?'Caixas produzidas':'Pacotes produzidos'}</div><div class="val">${fmtV(usaCx?t.cx:q)}</div><div class="det">${Q(q)} pacotes${t.paes?' · '+Q(t.paes)+' pães':''}</div></div>
    <div class="kpi lar"><div class="rot">${tituloMedia}</div><div class="val">${fmtV(media)}</div><div class="det">${un} · ${detMedia}</div></div>
    ${PD&&S.sem>=0?`<div class="kpi"><div class="rot">Dias com produção</div><div class="val">${nDias}</div><div class="det">na semana escolhida</div></div>`
      :`<div class="kpi"><div class="rot">Média por dia</div><div class="val">${PD?fmtV(mediaDia):'–'}</div><div class="det">${PD?`${un} · ${nDias} dias com produção`:'precisa do atualizador novo'}</div></div>`}
    <div class="kpi"><div class="rot">Venda</div><div class="val">${Q(t.qv)}</div><div class="det">pacotes vendidos</div></div>
    <div class="kpi"><div class="rot">Troca</div><div class="val">${Q(t.qt)}</div><div class="det">pacotes repostos</div></div>
  </div>`;
  if(t.qsem>0&&usaCx) h+=`<div class="aviso">${Q(t.qsem)} pacotes de produtos sem cadastro de caixa não entram na conta de caixas e pães (só nos pacotes). Para ver só hambúrguer, use os botões acima.</div>`;
  if(!q){ h+='<div class="card vazio">Sem produção para estes filtros.</div>'; return h+rodape()+'</main>'; }
  h+=`<div class="card"><h2>${usaCx?'Caixas':'Pacotes'} por ${!PD?'mês':porSem?'semana':'dia'}</h2><div class="graf"><canvas id="gP"></canvas></div><p class="nota">Linha tracejada laranja = ${tituloMedia.toLowerCase()} (${fmtV(media)} ${un}).${porSem&&buckets.some(k=>k.parcial)?' Semanas parciais (que começam ou terminam fora do período) não entram na média.':''}</p></div>`;
  window._grafP={labs:buckets.map(k=>k.curto),vals:buckets.map(k=>+val(k).toFixed(1)),media,usaCx};
  const colsB=[{t:!PD?'Mês':porSem?'Semana':'Dia',cls:'nome l',s:x=>x.b,asc:1,h:x=>x.lab},
    {t:'Venda<br>pct',s:x=>x.qv,h:x=>Q(x.qv)},{t:'Troca<br>pct',s:x=>x.qt,h:x=>Q(x.qt)},{t:'Total<br>pct',s:x=>x.qv+x.qt,h:x=>`${Q(x.qv+x.qt)}${x.paes?`<small class="u">${Q(x.paes)} pães</small>`:''}`},
    {t:'Caixas',s:x=>x.cx,h:x=>usaCx?`<b>${Cx(x.cx)}</b>`:'–'}];
  const foot=['Total',Q(t.qv),Q(t.qt),`${Q(q)}${t.paes?`<small class="u">${Q(t.paes)} pães</small>`:''}`,usaCx?Cx(t.cx):'–'];
  h+=`<div class="card"><h2>${!PD?'Mês a mês':porSem?'Semana a semana':'Dia a dia'}</h2><div class="rol">${tab('prB',colsB,buckets,{def:{c:0,d:1},cls:'pl',foot})}</div></div>`;
  const gs=Object.values(a.porG);
  if(gs.length>1){
    const colsG=[{t:'Grupo',txt:1,cls:'nome l',s:x=>x.g,h:x=>`${esc(x.g)}<small>${x.n.size} produto${x.n.size>1?'s':''}</small>`},
      {t:'Total<br>pct',s:x=>x.qv+x.qt,h:x=>Q(x.qv+x.qt)},{t:'Pães',s:x=>x.paes,h:x=>x.paes?Q(x.paes):'–'},{t:'Caixas',s:x=>x.cx,h:x=>x.cx?`<b>${Cx(x.cx)}</b>`:'–'}];
    h+=`<div class="card"><h2>Por grupo</h2><div class="rol">${tab('prG',colsG,gs.sort((x,y)=>y.cx-x.cx||(y.qv+y.qt)-(x.qv+x.qt)),{def:{c:3,d:-1},cls:'pl'})}</div></div>`;
  }
  const ps=Object.values(a.porP).filter(x=>x.qv||x.qt).sort((x,y)=>y.cx-x.cx||(y.qv+y.qt)-(x.qv+x.qt));
  const infoCad=p=>{const c=M.cad[p]; return c?`${c[3]} pct/caixa · ${c[2]} pães/pct`:'sem cadastro de caixa';};
  const colsP=[{t:'Produto',txt:1,cls:'nome l',s:x=>titulo(M.prod[x.p][0]),h:x=>`${esc(titulo(M.prod[x.p][0]))}<small>${esc(infoCad(x.p))}</small>`},
    {t:'Venda<br>pct',s:x=>x.qv,h:x=>Q(x.qv)},{t:'Troca<br>pct',s:x=>x.qt,h:x=>Q(x.qt)},{t:'Total<br>pct',s:x=>x.qv+x.qt,h:x=>`${Q(x.qv+x.qt)}${x.paes?`<small class="u">${Q(x.paes)} pães</small>`:''}`},
    {t:'Caixas',s:x=>M.cx[x.p]?x.cx:null,h:x=>M.cx[x.p]?`<b>${Cx(x.cx)}</b>`:'–'}];
  h+=`<div class="card"><h2>Produto a produto <span class="tag">${ps.length}</span></h2><div class="rol" style="max-height:560px">${tab('prP',colsP,ps,{def:{c:4,d:-1},cls:'pl',foot})}</div>
    <p class="nota">Produção = venda + troca (a troca também sai da fábrica; devolução não entra). Caixas = pacotes ÷ pacotes por caixa do cadastro. ${notaToque}</p></div>`;
  return h+rodape()+'</main>';
}
function grafProducao(){
  const g=window._grafP, el=document.getElementById('gP'); if(!g||!el) return;
  const muitos=g.labs.length>8, tam=g.labs.length>16?9.5:g.labs.length>8?10.5:12;
  const fmt=v=>g.usaCx?Cx(v):fmtMi(v);
  Chart.defaults.font.family='"Nunito Sans", system-ui, sans-serif'; Chart.defaults.color='#5E6B66';
  charts.push(new Chart(el,{type:'bar',plugins:[rotulos],data:{labels:g.labs,datasets:[
      {type:'bar',data:g.vals,backgroundColor:'#026E57',borderRadius:6,maxBarThickness:46,order:2,rot:{fmt,size:tam,cor:'#014D3D',vertical:muitos,tipo:'bar'}},
      {type:'line',data:g.labs.map(()=>g.media),borderColor:'#FD9B02',borderDash:[6,5],pointRadius:0,borderWidth:2,order:1}]},
    options:{animation:false,maintainAspectRatio:false,layout:{padding:{top:muitos?4:22}},plugins:{legend:{display:false},tooltip:{callbacks:{label:c=>c.datasetIndex?'Média '+fmt(c.raw):fmt(c.raw)+(g.usaCx?' caixas':' pacotes')}}},
      scales:{y:{beginAtZero:true,grace:'8%',ticks:{callback:v=>fmt(v),maxTicksLimit:6},grid:{color:'#EEE9DD'}},x:{grid:{display:false}}}}}));
}

// ---------- conferência dos grupos de produto (só diretoria) ----------
function telaGrupos(){
  const pg={}; M.prod.forEach((p,i)=>{ (pg[M.grp[i]]||(pg[M.grp[i]]=[])).push(i); });
  const gs=Object.keys(pg).sort((a,b)=>(b===window.GRUPO_HAMB_SEM)-(a===window.GRUPO_HAMB_SEM)||ordGrupo(a,b));
  const sem=pg[window.GRUPO_HAMB_SEM]||[];
  let h=topo('Grupos de produto',true)+'<main>';
  h+=`<p class="nota" style="margin:0 2px 10px">Como cada produto da base foi agrupado. Hambúrguer: pela coluna Linha do cadastro (Lanche / Mercado). Os demais: pelo nome. Para corrigir, mande a lista para a Controladoria ajustar o arquivo <b>grupos.js</b>.</p>`;
  if(sem.length) h+=`<div class="aviso"><b>${sem.length} hambúrguer${sem.length>1?'es':''} sem linha no cadastro</b> — informe se é Linha Lanche ou Linha Mercado (e pacotes por caixa / pães por pacote).</div>`;
  h+=`<div class="card grp">${gs.map(g=>`<h3><span>${esc(g)}</span><span class="tag">${pg[g].length}</span></h3><ul>${pg[g].sort(ordNome).map(i=>`<li>${esc(titulo(M.prod[i][0]))} <small>· cód. ${esc(M.prod[i][1])}${M.cad[i]?` · ${M.cad[i][3]} pct/cx · ${M.cad[i][2]} pães/pct`:''}</small></li>`).join('')}</ul>`).join('')}</div>`;
  return h+rodape()+'</main>';
}

// ---------- início ----------
(async()=>{
  if('serviceWorker' in navigator){ try{ navigator.serviceWorker.register('sw.js'); }catch(e){} }
  try{
    if(!window.CFG||!/^https:\/\/.+\.supabase\.co$/.test(CFG.url||'')) throw new Error('config.js sem o endereço do Supabase (ainda está com COLE_AQUI?)');
    if(typeof supabase==='undefined'){ // biblioteca bloqueada: tenta outro endereço
      await new Promise((ok,err)=>{const sc=document.createElement('script');sc.src='https://unpkg.com/@supabase/supabase-js@2/dist/umd/supabase.js';sc.onload=ok;sc.onerror=()=>err(new Error('não consegui baixar a biblioteca de login (rede bloqueando cdn.jsdelivr.net e unpkg.com?)'));document.head.appendChild(sc);});
    }
    SB=supabase.createClient(CFG.url,CFG.chave,{auth:{persistSession:true,autoRefreshToken:true}});
    const {data}=await SB.auth.getSession();
    U=usuarioDaSessao(data.session);
    if(U) await abrir(); else render();
  }catch(e){ console.error(e); document.getElementById('app').innerHTML='<div class="carregando" style="padding:0 20px;text-align:center">Não foi possível iniciar o app. Verifique a internet.<small style="display:block;margin-top:10px;color:#9a6">Detalhe: '+esc(e&&e.message||e)+'</small></div>'; }
})();
